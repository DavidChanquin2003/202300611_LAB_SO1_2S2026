apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-server
  template:
    metadata:
      labels:
        app: go-server
    spec:
      containers:
      - name: go-server
        image: host.minikube.internal:5000/go-server:v1
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: go-server-svc
spec:
  selector:
    app: go-server
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051