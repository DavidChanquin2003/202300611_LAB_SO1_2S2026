apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
      - name: api-rust
        image: host.minikube.internal:5000/api-rust:v2
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust-svc
spec:
  selector:
    app: api-rust
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080